name: Release
on:
    push:
        branches:
            - main

env:
    FORCE_COLOR: true
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
    contents: write

jobs:
    Build:
        name: Build Myicord
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build
              run: pnpm buildStandalone

            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json

            - name: Collect files to be released
              run: |
                  cd dist
                  mkdir release

                  cp browser/browser.* release
                  cp Equicord.user.{js,js.LEGAL.txt} release

                  # copy the plugin data jsons, the extension zips and the desktop/equibop asars
                  cp *.{json,zip,asar} release

                  # legacy un-asared files
                  cp desktop/* release
                  for file in equibop/*; do
                    filename=$(basename "$file")
                    cp "$file" "release/equibop${filename^}"
                  done

                  find release -size 0 -delete
                  rm release/package.json
                  rm release/*.map

            - name: Upload Equicord Stable
              if: ${{ vars.ACT == 'false' }}
              run: |
                  set -euo pipefail

                  # Only run on tag refs
                  if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
                  echo "Not a tag ref (${GITHUB_REF_TYPE}), skipping release upload."
                  exit 0
                  fi

                  TAG="${GITHUB_REF_NAME}"
                  echo "Verifying tag '${TAG}' exists..."

                  # Verify the tag exists on the remote
                  if ! git ls-remote --tags --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
                  echo "::error::Tag '${TAG}' does not exist on origin. Aborting."
                  exit 1
                  fi

                  # Verify the tag matches the current commit (guards against moved/rebuilt tags)
                  LOCAL_SHA="$(git rev-parse HEAD)"
                  TAG_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
                  if [[ "${LOCAL_SHA}" != "${TAG_SHA}" ]]; then
                  echo "::error::Tag '${TAG}' (${TAG_SHA}) does not match HEAD (${LOCAL_SHA})."
                  exit 1
                  fi

                  echo "Tag '${TAG}' verified. Uploading to 'latest' release..."

                  # Create the release if it doesn't already exist
                  if ! gh release view latest >/dev/null 2>&1; then
                  gh release create latest --latest=false --title "Equicord Stable" --notes "Built from ${TAG}"
                  fi

                  gh release upload latest --clobber dist/release/*
