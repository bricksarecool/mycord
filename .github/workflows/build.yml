name: Release
on:
    push:
        branches:
            - main

env:
    FORCE_COLOR: true
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
    contents: write

jobs:
    Build:
        name: Build Myicord
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build
              run: pnpm buildStandalone

            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json

            - name: Collect files to be released
              run: |
                  cd dist
                  mkdir release

                  cp browser/browser.* release
                  cp Equicord.user.{js,js.LEGAL.txt} release

                  # copy the plugin data jsons, the extension zips and the desktop/equibop asars
                  cp *.{json,zip,asar} release

                  # legacy un-asared files
                  cp desktop/* release
                  for file in equibop/*; do
                    filename=$(basename "$file")
                    cp "$file" "release/equibop${filename^}"
                  done

                  find release -size 0 -delete
                  rm release/package.json
                  rm release/*.map

            - name: Upload Equicord Stable
              if: ${{ vars.ACT == 'false' }}
              run: |
                  set -euo pipefail
                  # Always refresh tags in case the runner cached an old clone
                  git fetch --tags --force origin

                  # 1. Build today's date prefix (UTC, e.g. 2026-09-18)
                  DATE="$(date -u +%Y-%m-%d)"
                  echo "Date prefix: ${DATE}"

                  # 2. Find the highest existing <DATE>-<n> tag
                  LAST_N="$(
                  git tag --list "${DATE}-*" \
                      | sed -E "s/^${DATE}-([0-9]+)$/\1/" \
                      | grep -E '^[0-9]+$' \
                      | sort -n \
                      | tail -n1 \
                  || true
                  )"
                  NEXT_N=$(( ${LAST_N:-0} + 1 ))
                  TAG="${DATE}-${NEXT_N}"
                  echo "Next tag: ${TAG}"

                  # 3. Make sure it doesn't already exist (belt and braces)
                  if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
                  echo "::error::Tag '${TAG}' already exists locally."
                  exit 1
                  fi
                  if git ls-remote --tags --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
                  echo "::error::Tag '${TAG}' already exists on origin."
                  exit 1
                  fi

                  # 4. Create and push the tag
                  git config user.name  "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git tag -a "${TAG}" -m "Equicord Stable ${TAG}"
                  git push origin "refs/tags/${TAG}"
                  echo "Pushed tag ${TAG}."

                  # 5. Publish / update the floating 'latest' release
                  if ! gh release view latest >/dev/null 2>&1; then
                  gh release create latest \
                      --latest=false \
                      --title "Equicord Stable" \
                      --notes "Last built from tag ${TAG} ($(git rev-parse --short HEAD))"
                  else
                  gh release edit latest \
                      --notes "Last built from tag ${TAG} ($(git rev-parse --short HEAD))"
                  fi

                  gh release upload latest --clobber dist/release/*
                  echo "Uploaded assets to 'latest' release."
